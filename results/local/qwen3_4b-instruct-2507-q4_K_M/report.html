<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>실험 결과</title>
<!--
  이 화면은 계산된 값을 담고 있지 않습니다.
  records.js 에 실린 원본 실행 기록과 정답을 읽어, 열릴 때마다 아래 JS 가 직접 집계해 그립니다.
  숫자를 고치고 싶으면 실험을 다시 돌리면 되고, 보는 방식을 고치고 싶으면 이 파일만 고치면 됩니다.

  데이터를 fetch 가 아니라 <script src> 로 읽는 이유는, file:/// 에서는 브라우저가 fetch 로
  로컬 파일을 읽는 것을 막기 때문입니다.
-->
<style>
  :root { --line:#e2e0d8; --muted:#6b6a64; --bg:#faf9f5; --card:#fff;
          --ok:#1d6b4f; --okbg:#e6f3ec; --ng:#a33; --ngbg:#fbeaea; }
  * { box-sizing:border-box; }
  body { margin:0; padding:32px 16px 64px; background:var(--bg); color:#22211e;
         font:15px/1.65 -apple-system,"Segoe UI","Malgun Gothic",sans-serif; }
  main { max-width:880px; margin:0 auto; }
  h1 { font-size:24px; font-weight:600; margin:0 0 4px; }
  h2 { font-size:17px; font-weight:600; margin:36px 0 10px; }
  .sub { color:var(--muted); font-size:14px; margin:0 0 6px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:10px;
          padding:18px 20px; margin-top:12px; }
  .banner { display:flex; align-items:center; gap:14px; padding:18px 20px; border-radius:10px;
            margin:20px 0 4px; border:1px solid; }
  .banner.pass { background:var(--okbg); border-color:#bfe0cf; }
  .banner.fail { background:var(--ngbg); border-color:#eec9c9; }
  .banner b { font-size:20px; }
  table { width:100%; border-collapse:collapse; font-size:14px; }
  th,td { text-align:left; padding:8px 10px; border-bottom:1px solid var(--line); }
  th { color:var(--muted); font-weight:500; font-size:13px; }
  tr:last-child td { border-bottom:none; }
  td.num, th.num { text-align:right; font-variant-numeric:tabular-nums; }
  .tag { display:inline-block; padding:1px 8px; border-radius:99px; font-size:12px; font-weight:600; }
  .tag.ok { background:var(--okbg); color:var(--ok); }
  .tag.ng { background:var(--ngbg); color:var(--ng); }
  .bar { height:10px; background:#eceae2; border-radius:99px; overflow:hidden; margin-top:6px; }
  .bar > i { display:block; height:100%; background:#8a8577; }
  blockquote { margin:10px 0 0; padding:12px 16px; background:#f5f3ec;
               border-left:3px solid #cfcbbd; border-radius:0 6px 6px 0; }
  blockquote .who { font-weight:600; }
  blockquote .meta { color:var(--muted); font-size:13px; margin-top:6px; }
  code { background:#f0eee7; padding:1px 5px; border-radius:4px; font-size:13px; }
  .note { color:var(--muted); font-size:13px; margin-top:10px; }
  .miss { color:var(--ng); font-weight:600; }
  @media print { body { background:#fff; padding:0; } .card,.banner { break-inside:avoid; } }
</style>
</head>
<body>
<main id="app">records.js 를 불러오지 못했습니다. 같은 폴더에 있는지 확인하세요.</main>

<script src="records.js"></script>
<script>
(function () {
  var META = window.REPORT_META, ROWS = window.RECORDS,
      WARM = window.WARMUP || [], KEY = window.ANSWER_KEY;
  if (!META || !ROWS || !KEY) return;

  // ---------- 집계 (열릴 때 원본 기록에서 직접 계산) ----------
  var PASS = { include: 7, exclude: 0, elapsed: 60 };

  var ok = ROWS.filter(function (r) { return !r.error && r.validation; });

  function mean(list) {
    var v = list.filter(function (x) { return x !== null && x !== undefined; });
    return v.length ? Math.round((v.reduce(function (a, b) { return a + b; }, 0) / v.length) * 10) / 10 : null;
  }
  function nOf(list) {
    return list.filter(function (x) { return x !== null && x !== undefined; }).length;
  }
  function pick(list, f) { return list.map(f); }
  function normId(v) { return String(v == null ? "" : v).trim().replace(/^\[|\]$/g, "").trim(); }

  var includeMax = ok.length ? ok[0].validation.include_total : 10;
  var incAvg = mean(pick(ok, function (r) { return r.validation.hit_include; }));
  var excAvg = mean(pick(ok, function (r) { return r.validation.miss_exclude; }));
  var elapsedList = pick(ok, function (r) { return r.perf.elapsed_sec; });
  var tpsList = pick(ok, function (r) { return r.perf.tokens_per_sec; });
  var formatNg = ok.filter(function (r) { return !r.validation.format_ok; }).length;

  var bySet = {};
  ok.forEach(function (r) {
    (bySet[r.set] = bySet[r.set] || []).push(r);
  });
  var setNames = Object.keys(bySet).sort();
  var stable = setNames.filter(function (s) {
    var seen = {};
    bySet[s].forEach(function (r) { seen[r.validation.picked_ids.slice().sort().join(",")] = 1; });
    return Object.keys(seen).length === 1;
  }).length;

  var checks = [
    { label: "정답을 골랐는가", value: incAvg + "명 / " + includeMax + "명",
      limit: PASS.include + "명 이상", pass: (incAvg || 0) >= PASS.include },
    { label: "가면 안 될 사람을 넣었는가", value: excAvg + "명",
      limit: "0명", pass: excAvg === PASS.exclude },
    { label: "형식을 지켰는가", value: (ok.length - formatNg) + " / " + ok.length + "회",
      limit: "전부", pass: formatNg === 0 },
    { label: "같은 명부에 같은 답을 내는가", value: stable + " / " + setNames.length + " 세트",
      limit: "전부", pass: stable === setNames.length },
    { label: "제한 시간 안에 답하는가", value: mean(elapsedList) + "초",
      limit: PASS.elapsed + "초 이내", pass: (mean(elapsedList) || 1e9) <= PASS.elapsed }
  ];
  var passed = checks.every(function (c) { return c.pass; });

  var acute = 0, acuteTotal = 0, chronic = 0, chronicTotal = 0;
  ok.forEach(function (r) {
    var picked = {}; r.validation.picked_ids.forEach(function (i) { picked[i] = 1; });
    (KEY[r.set].must_include || []).forEach(function (x) {
      if (x.kind === "급성") { acuteTotal++; if (picked[x.id]) acute++; }
      else { chronicTotal++; if (picked[x.id]) chronic++; }
    });
  });

  var issues = {};
  ok.forEach(function (r) {
    r.validation.issues.forEach(function (i) {
      var k = i.split(":")[0]; issues[k] = (issues[k] || 0) + 1;
    });
  });
  var issueList = Object.keys(issues).map(function (k) { return [k, issues[k]]; })
                    .sort(function (a, b) { return b[1] - a[1]; });

  function entriesOf(row) {
    var m = /\{[\s\S]*\}/.exec(row.answer || "");
    if (!m) return [];
    try { return JSON.parse(m[0]).top10 || []; } catch (e) { return []; }
  }
  function bestBy(f) {
    return ok.reduce(function (a, b) { return !a || f(b) > f(a) ? b : a; }, null);
  }
  var best = bestBy(function (r) { return r.validation.hit_include; });
  var worst = bestBy(function (r) { return r.validation.miss_exclude; });

  function goodExample() {
    if (!best) return null;
    var keyed = {};
    (KEY[best.set].must_include || []).forEach(function (x) { keyed[x.id] = x; });
    var found = null;
    entriesOf(best).some(function (e) {
      var id = normId(e.id);
      if (keyed[id]) {
        found = { row: best, entry: e, meta: "정답 사유: " + keyed[id].case + " (" + keyed[id].kind + ")" };
        return true;
      }
      return false;
    });
    return found;
  }
  function badExample() {
    if (!worst || !worst.validation.miss_exclude) return null;
    var ids = {};
    (KEY[worst.set].must_exclude || []).forEach(function (x) { ids[x.id] = 1; });
    var members = KEY[worst.set].members || {};
    var found = null;
    entriesOf(worst).some(function (e) {
      var id = normId(e.id);
      if (ids[id]) {
        var m = members[id] || {};
        found = { row: worst, entry: e, meta: "명부: " + m.recent_attendance + " / 건강 " +
          m.health_note + " / 비고 " + m.special_note + " / 마지막 심방 " + m.last_visitation_date };
        return true;
      }
      return false;
    });
    return found;
  }

  // ---------- 그리기 ----------
  function esc(s) {
    return String(s == null ? "" : s).replace(/[&<>"]/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c];
    });
  }
  function tag(v) { return '<span class="tag ' + (v ? "ok" : "ng") + '">' + (v ? "통과" : "미달") + "</span>"; }
  function pct(a, b) { return b ? Math.round((a / b) * 100) : 0; }
  function val(x, u) { return x === null || x === undefined ? "측정 못 함" : x + u; }

  var h = [];
  h.push("<h1>" + esc(META.title) + " — " + esc(META.model) + "</h1>");
  h.push('<p class="sub">' + esc(META.task) + "</p>");
  h.push('<p class="sub">' + esc(META.run_at) + " · 평가 세트 " + setNames.length + "개 × " +
         Math.round(ok.length / Math.max(setNames.length, 1)) + "회 = " + ROWS.length +
         "회 · 호출 성공 " + ok.length + "/" + ROWS.length + "</p>");

  h.push('<div class="banner ' + (passed ? "pass" : "fail") + '"><b>' + (passed ? "통과" : "미달") +
         "</b><span>" + (passed ? "필수 조건을 모두 넘었습니다."
                                : "필수 조건 중 넘지 못한 항목이 있습니다.") + "</span></div>");

  h.push("<h2>판정</h2><div class='card'><table><tr><th>조건</th><th>결과</th><th>기준</th><th></th></tr>");
  checks.forEach(function (c) {
    h.push("<tr><td>" + esc(c.label) + "</td><td>" + esc(c.value) + "</td><td>" + esc(c.limit) +
           "</td><td>" + tag(c.pass) + "</td></tr>");
  });
  h.push("</table></div>");

  h.push("<h2>세트별 결과</h2>");
  h.push('<p class="sub">정답 ' + includeMax + "명 중 몇 명을 골랐는지. 괄호는 넣지 말았어야 할 사람 수.</p>");
  h.push("<div class='card'><table><tr><th>세트</th><th class='num'>1회차</th><th class='num'>2회차</th>" +
         "<th>두 번이 같은 답인가</th><th class='num'>시간</th></tr>");
  setNames.forEach(function (s) {
    var rs = bySet[s].slice().sort(function (a, b) { return a.attempt - b.attempt; });
    function cell(i) {
      var a = rs[i];
      if (!a) return "—";
      var x = a.validation.hit_include + "명";
      if (a.validation.miss_exclude > 0) x += ' <span class="miss">(' + a.validation.miss_exclude + ")</span>";
      return x;
    }
    var seen = {};
    rs.forEach(function (r) { seen[r.validation.picked_ids.slice().sort().join(",")] = 1; });
    var same = Object.keys(seen).length === 1;
    h.push("<tr><td>" + esc(s) + "</td><td class='num'>" + cell(0) + "</td><td class='num'>" + cell(1) +
           "</td><td>" + (same ? "같음" : '<span class="miss">다름</span>') + "</td><td class='num'>" +
           mean(pick(rs, function (r) { return r.perf.elapsed_sec; })) + "초</td></tr>");
  });
  h.push("</table></div>");

  h.push("<h2>급한 사람을 알아보는가</h2><div class='card'>");
  [["급성 — 지난주 상, 3주 전 수술 등", acute, acuteTotal],
   ["만성 — 장기 입원, 발길 끊김 등", chronic, chronicTotal]].forEach(function (r) {
    h.push("<div style='margin-bottom:14px'><div>" + esc(r[0]) + " <b>" + r[1] + "/" + r[2] + "</b> (" +
           pct(r[1], r[2]) + "%)</div><div class='bar'><i style='width:" + pct(r[1], r[2]) + "%'></i></div></div>");
  });
  h.push('<p class="note">' + (Math.abs(pct(acute, acuteTotal) - pct(chronic, chronicTotal)) <= 8
    ? "두 값이 비슷합니다. 시점 조건을 답에 반영하지 못했다는 뜻입니다."
    : "급성을 더 잘 골라냅니다.") + "</p></div>");

  var g = goodExample(), b = badExample();
  if (g || b || issueList.length) h.push("<h2>실제 응답</h2>");
  if (g) {
    h.push("<div class='card'><b>잘 고른 예</b> — " + esc(g.row.set) + " " + g.row.attempt + "회차, " +
           g.row.validation.hit_include + "명 적중<blockquote><span class='who'>" + esc(g.entry.rank) +
           "위 " + esc(g.entry.name) + "</span><br>" + esc(g.entry.reason) +
           "<div class='meta'>" + esc(g.meta) + "</div></blockquote></div>");
  }
  if (b) {
    h.push("<div class='card'><b>잘못 고른 예</b> — " + esc(b.row.set) + " " + b.row.attempt +
           "회차, 가면 안 될 사람 " + b.row.validation.miss_exclude +
           "명 포함<blockquote><span class='who'>" + esc(b.entry.rank) + "위 " + esc(b.entry.name) +
           "</span><br>" + esc(b.entry.reason) + "<div class='meta'>" + esc(b.meta) + "</div></blockquote></div>");
  }
  if (issueList.length) {
    h.push("<div class='card'><b>형식 문제</b><table><tr><th>유형</th><th class='num'>건수</th></tr>");
    issueList.forEach(function (p) {
      h.push("<tr><td>" + esc(p[0]) + "</td><td class='num'>" + p[1] + "</td></tr>");
    });
    h.push("</table></div>");
  }

  var warmLoad = WARM.length ? WARM[0].perf.load_sec : null;
  var speedNg = ok.filter(function (r) { return r.perf.speed_note; }).length;
  h.push("<h2>성능</h2><div class='card'><table>");
  h.push("<tr><td>응답 시간 (평균)</td><td class='num'>" + val(mean(elapsedList), "초") +
         "</td><td class='num'>n=" + nOf(elapsedList) + "</td></tr>");
  h.push("<tr><td>생성 속도 (평균)</td><td class='num'>" + val(mean(tpsList), " tok/s") +
         "</td><td class='num'>n=" + nOf(tpsList) + "</td></tr>");
  h.push("<tr><td>출력 토큰 (평균)</td><td class='num'>" +
         val(mean(pick(ok, function (r) { return r.perf.eval_count; })), "개") + "</td><td></td></tr>");
  h.push("<tr><td>모델 로딩 (워밍업 1회)</td><td class='num'>" + val(warmLoad, "초") + "</td><td></td></tr>");
  h.push("<tr><td>속도 계산 불가</td><td class='num'>" + speedNg + "건</td><td></td></tr>");
  h.push("</table><p class='note'>워밍업 1회는 위 평균에 넣지 않았습니다. 첫 호출에는 모델 로딩 시간이 " +
         "섞입니다.<br>첫 토큰 지연은 측정하지 않았습니다. 위 응답 시간은 TTFT가 아닙니다.</p></div>");

  var o = ok.length ? ok[0].options : {};
  h.push("<h2>실행 조건</h2><div class='card'><table>");
  [["모델", "<code>" + esc(META.model) + "</code>"],
   ["num_ctx", o.num_ctx == null ? "—" : o.num_ctx.toLocaleString()],
   ["temperature", String(o.temperature)],
   ["출력 한도", o.num_predict == null ? "지정 안 함" : o.num_predict],
   ["프롬프트 크기", ok.length ? ok[0].prompt_chars.toLocaleString() + "자" : "—"],
   ["원본 기록", "<code>" + esc(META.source) + "</code>"]].forEach(function (r) {
    h.push("<tr><td>" + esc(r[0]) + "</td><td>" + r[1] + "</td></tr>");
  });
  h.push("</table><p class='note'>다시 돌리기: <code>" + esc(META.rerun) + "</code></p></div>");

  document.getElementById("app").innerHTML = h.join("");
  document.title = META.title + " — " + META.model;
})();
</script>
</body>
</html>
