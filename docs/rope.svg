<svg width="680" height="330" viewBox="0 0 680 330" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, 'Segoe UI', 'Malgun Gothic', sans-serif">
<rect width="680" height="330" fill="#ffffff"/>
<defs>
  <marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  </marker>
</defs>

<text x="40" y="34" font-size="14" font-weight="500" fill="#22211e">1. 위치가 곧 회전 각도</text>
<text x="40" y="54" font-size="12" fill="#6b6a64">같은 단어라도 몇 번째 자리에 있느냐에 따라 벡터를 그만큼 돌린다</text>

<circle cx="175" cy="165" r="72" fill="none" stroke="#e2e0d8" stroke-width="1" stroke-dasharray="3 3"/>
<line x1="103" y1="165" x2="247" y2="165" stroke="#e2e0d8" stroke-width="1"/>
<line x1="175" y1="93" x2="175" y2="237" stroke="#e2e0d8" stroke-width="1"/>

<path d="M 234 152 A 72 72 0 0 0 216 114" fill="none" stroke="#888780" stroke-width="1"/>
<text x="243" y="124" font-size="12" fill="#5F5E5A">각도차 = 거리</text>

<line x1="175" y1="165" x2="246" y2="152" stroke="#534AB7" stroke-width="2" marker-end="url(#ar)"/>
<text x="254" y="150" font-size="12" fill="#534AB7" dominant-baseline="central">1번째 자리</text>

<line x1="175" y1="165" x2="222" y2="111" stroke="#993C1D" stroke-width="2" marker-end="url(#ar)"/>
<text x="206" y="96" font-size="12" fill="#993C1D" dominant-baseline="central">5번째 자리</text>

<text x="40" y="270" font-size="12" fill="#22211e">내적은 두 각도의 <tspan font-weight="500">차이</tspan>에만 달려 있다.</text>
<text x="40" y="290" font-size="12" fill="#6b6a64">3번과 7번, 20번과 24번 &#8212; 절대 위치가 달라도</text>
<text x="40" y="308" font-size="12" fill="#6b6a64">거리가 4칸이면 같은 값이 된다.</text>

<line x1="330" y1="24" x2="330" y2="306" stroke="#e2e0d8" stroke-width="1"/>

<text x="370" y="34" font-size="14" font-weight="500" fill="#22211e">2. 멀어지면 약해진다 (long-term decay)</text>
<text x="370" y="54" font-size="12" fill="#6b6a64">벡터를 2차원씩 쪼개 짝마다 다른 속도로 돌린다</text>

<line x1="410" y1="90" x2="410" y2="230" stroke="#b4b2a9" stroke-width="1"/>
<line x1="410" y1="230" x2="645" y2="230" stroke="#b4b2a9" stroke-width="1"/>
<path d="M410 100 C 450 175, 500 200, 645 216" fill="none" stroke="#0F6E56" stroke-width="2"/>
<text x="404" y="96" font-size="12" fill="#6b6a64" text-anchor="end" dominant-baseline="central">높음</text>
<text x="404" y="228" font-size="12" fill="#6b6a64" text-anchor="end" dominant-baseline="central">낮음</text>
<text x="410" y="248" font-size="12" fill="#6b6a64" dominant-baseline="central">가까움</text>
<text x="645" y="248" font-size="12" fill="#6b6a64" text-anchor="end" dominant-baseline="central">멂</text>
<text x="527" y="268" font-size="12" fill="#6b6a64" text-anchor="middle" dominant-baseline="central">두 토큰 사이 거리</text>
<text x="370" y="78" font-size="12" fill="#6b6a64">세로: 어텐션 상한</text>

<text x="370" y="290" font-size="12" fill="#22211e">거리가 멀면 빠르게 도는 짝들이 여러 바퀴를 돌아</text>
<text x="370" y="308" font-size="12" fill="#22211e">제각각 흩어지고 서로 상쇄된다.</text>
</svg>
